[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-custom-emailtpl"
version = "0.2.1"
description = "Tutor plugin + Django app to override enrollment/instructor ACE email templates without editing edx-platform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tutor>=22.0.0,<23.0.0",
]

[project.optional-dependencies]
dev = [
    "celery>=5.3,<6.0",
    "Django>=4.2,<5.3",
]

[project.entry-points."tutor.plugin.v1"]
emailtpl = "plugin"

[tool.setuptools]
py-modules = ["plugin"]

[tool.setuptools.packages.find]
where = ["."]
include = ["emailtpl_app*"]

[tool.setuptools.package-data]
emailtpl_app = ["templates/**/*"]